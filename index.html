<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="L'application de toute la famille : bébé, agenda, budget, santé, vacances… vous activez ce dont vous avez besoin.">
  <meta name="theme-color" content="#1A2235">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AppFamille">
  <title>AppFamille</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/design.css">
  <script>
    // Applique le thème (et, en édition Premium, la personnalisation enregistrée) avant le premier rendu : pas de flash.
    (function () {
      var des = /\/appdesign(\/|$)/i.test(location.pathname) || /[?&]edition=design/.test(location.search);
      var pre = des || /\/apppre(\/|$)/i.test(location.pathname) || /[?&]edition=pre/.test(location.search);
      var t = 'auto';
      try { t = (JSON.parse(localStorage.getItem(des ? 'appdesign:v1' : pre ? 'apppre:v1' : 'appfamille:v1')) || {}).theme || 'auto'; } catch (e) {}
      if (t === 'auto') { var h = new Date().getHours(); t = (h >= 19 || h < 8) ? 'dark' : 'light'; }
      document.documentElement.dataset.theme = t;
      if (pre) {
        document.documentElement.dataset.edition = des ? 'design' : 'pre';
        var m = document.querySelector('link[rel="manifest"]'); if (m) m.setAttribute('href', des ? 'manifest-design.webmanifest' : 'manifest-pre.webmanifest');
        var i = document.querySelector('link[rel="apple-touch-icon"]'); if (i) i.setAttribute('href', des ? 'icons/icon-design-192.png' : 'icons/icon-pre-192.png');
        document.title = des ? 'AppFamille Design' : 'AppFamille Premium';
        var at = document.querySelector('meta[name="apple-mobile-web-app-title"]'); if (at) at.setAttribute('content', des ? 'AppDesign' : 'AppPre');
        if (des) { var f = document.createElement('link'); f.rel = 'stylesheet'; f.href = 'https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap'; document.head.appendChild(f); }
        try { var css = localStorage.getItem(des ? 'appdesign:css' : 'apppre:css'); if (css) { var st = document.createElement('style'); st.id = 'ui-override'; st.textContent = css; document.head.appendChild(st); } } catch (e) {}
      }
    })();
  </script>
</head>
<body>
  <div class="app">
    <main id="main" tabindex="-1"></main>
  </div>

  <nav class="appnav" id="appnav" aria-label="Navigation principale"><div class="appnav-inner"></div></nav>

  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
