<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Suivi quotidien de bébé, diversification, espace parents et sons apaisants — 100 % sur votre appareil.">
  <meta name="theme-color" content="#1A2235">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AppBébé">
  <title>AppBébé</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="css/styles.css">
  <script>
    // Applique le thème avant le premier rendu (pas de flash).
    (function () {
      var t = 'auto';
      try { t = (JSON.parse(localStorage.getItem('appbebe:v2')) || {}).theme || 'auto'; } catch (e) {}
      if (t === 'auto') { var h = new Date().getHours(); t = (h >= 19 || h < 8) ? 'dark' : 'light'; }
      document.documentElement.dataset.theme = t;
    })();
  </script>
</head>
<body>
  <div class="app">
    <main id="main" tabindex="-1"></main>
  </div>

  <nav class="tabbar" aria-label="Navigation principale">
    <div class="tabbar-inner">
      <a class="tab" data-tab="home" href="#/home"><svg class="i" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1z"/></svg>Accueil</a>
      <a class="tab" data-tab="food" href="#/food"><svg class="i" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 19C5 11 10.5 5.5 20 5c-.5 9.5-6 15-14 15"/><path d="M5 19 13 11"/></svg>Repas</a>
      <button class="fab" id="fab" aria-label="Ajout rapide"><svg class="i" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
      <a class="tab" data-tab="parents" href="#/parents"><svg class="i" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7a4.3 4.3 0 0 1 7.5 2.8C19.5 15.4 12 20 12 20z"/></svg>Parents</a>
      <a class="tab" data-tab="sleep" href="#/sleep"><svg class="i" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>Sommeil</a>
    </div>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast-root" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
