<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1A2235">
<title>AppBébé</title>
<style>
:root{--bg:#1A2235;--bg2:#222B40;--card:#2B3550;--txt:#E9ECF3;--mut:#9AA4BC;--sal:#E8A08A;--sag:#9CBFA4;--ard:#8E9BC7;--jau:#E6C77A;--bri:#B5654F;--r:22px}
:root[data-t=light]{--bg:#F6F4EF;--bg2:#E9F1F8;--card:#E4E6EA;--txt:#232B3C;--mut:#5D667B;--sal:#D9795C;--sag:#6E9B7A;--ard:#5F6FA3;--jau:#B8912F;--bri:#A4492F}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--txt);font:16px/1.4 ui-rounded,"Nunito","Segoe UI",system-ui,sans-serif;padding-top:env(safe-area-inset-top);overflow:hidden}
button{font:inherit;color:inherit;border:0;background:var(--card);border-radius:var(--r);padding:14px;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--jau);outline-offset:2px}
input,select{font:inherit;color:var(--txt);background:var(--card);border:0;border-radius:14px;padding:12px;width:100%}
#app{height:100%;display:flex;flex-direction:column}
header{display:flex;gap:8px;align-items:center;padding:10px 14px}
header select{flex:1;font-weight:700}
header button{padding:10px 14px;border-radius:14px}
main{flex:1;overflow-y:auto;padding:0 14px 150px}
h1{font-size:1.5rem;margin:8px 0}h2{font-size:1.1rem;margin:18px 0 8px}
.card{background:var(--card);border-radius:var(--r);padding:14px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.big{min-height:128px;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;text-align:left;font-weight:700;font-size:1.15rem;gap:4px}
.big small{font-weight:400;color:var(--mut);font-size:.85rem}
.big .i{font-size:2rem}
.sal{background:color-mix(in srgb,var(--sal) 28%,var(--card))}.sag{background:color-mix(in srgb,var(--sag) 28%,var(--card))}.ard{background:color-mix(in srgb,var(--ard) 30%,var(--card))}.jau{background:color-mix(in srgb,var(--jau) 28%,var(--card))}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--bg2);padding:6px 6px calc(6px + env(safe-area-inset-bottom));gap:6px;z-index:5}
nav button{flex:1;background:none;padding:12px 2px;font-size:.78rem;color:var(--mut);border-radius:16px}
nav button b{display:block;font-size:1.5rem}
nav button.on{background:var(--card);color:var(--txt)}
#fab{position:fixed;right:18px;bottom:calc(92px + env(safe-area-inset-bottom));width:68px;height:68px;border-radius:50%;background:var(--sal);color:#1A2235;font-size:2.2rem;z-index:6;padding:0;box-shadow:0 6px 18px #0006}
#feed{position:fixed;left:12px;right:96px;bottom:calc(92px + env(safe-area-inset-bottom));background:var(--card);border-radius:18px;padding:10px 14px;font-size:.85rem;color:var(--mut);z-index:4}
#sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}
#sheet.open{display:flex}
#sheet>div{background:var(--bg2);width:100%;max-height:88%;overflow-y:auto;border-radius:28px 28px 0 0;padding:18px 16px calc(22px + env(safe-area-inset-bottom))}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1;min-width:80px}
.btn{padding:20px 10px;font-weight:700;font-size:1.05rem}
.pri{background:var(--sal);color:#1A2235}
.timer{font-size:3rem;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;margin:10px 0}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.keys button{padding:18px;font-size:1.3rem}
.chip{display:inline-block;padding:6px 12px;border-radius:99px;font-size:.8rem;font-weight:700;background:var(--card);color:var(--mut)}
.chip.ok{background:var(--sag);color:#17281c}.chip.re{background:var(--jau);color:#2d2408}.chip.al{background:var(--bri);color:#fff}
.tabs{display:flex;gap:8px;margin:8px 0}.tabs button{flex:1;font-weight:700}.tabs .on{background:var(--ard);color:#fff}
.moods{display:flex;gap:6px}.moods button{flex:1;font-size:1.8rem;padding:12px 0}.moods .on{outline:3px solid var(--jau)}
.car{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px}.car>div{min-width:78%;scroll-snap-align:start}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:.75rem}.cal div{background:var(--card);border-radius:12px;padding:6px 2px;min-height:70px}
.log{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #ffffff14;font-size:.92rem}
.ck{display:flex;gap:10px;align-items:center;padding:10px 0}.ck input{width:24px;height:24px}
.breath{width:150px;height:150px;border-radius:50%;margin:16px auto;background:var(--ard);display:grid;place-items:center;font-weight:800;transition:transform 5s ease-in-out}
#night{position:fixed;inset:0;background:#000;opacity:.0;pointer-events:none;z-index:30;display:none}
#night.on{display:flex;opacity:1;pointer-events:auto;align-items:center;justify-content:center}
#night span{width:70px;height:70px;border-radius:50%;background:radial-gradient(#E6C77A55,#0000 70%)}
.snd{background:#1a2133;min-height:96px;font-weight:700;text-align:left}
.play{background:var(--jau);color:#1A2235;width:76px;height:76px;border-radius:50%;font-size:1.8rem;padding:0}
.bar{height:8px;border-radius:9px;background:var(--card);overflow:hidden}.bar i{display:block;height:100%;background:var(--jau);width:0}
.dark-sleep{--card:#1D2640}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app">
<header>
 <select id="kid" aria-label="Profil enfant"></select>
 <button id="addk" aria-label="Ajouter un profil">+ Profil</button>
 <button id="theme" aria-label="Mode sombre">🌙</button>
</header>
<main id="main"></main>
</div>
<div id="feed"></div>
<button id="fab" aria-label="Ajouter une note, un vaccin ou un médicament">+</button>
<nav id="nav">
 <button data-p="home"><b>🏠</b>Suivi</button>
 <button data-p="food"><b>🥕</b>Diversification</button>
 <button data-p="par"><b>💛</b>Parents</button>
 <button data-p="snd"><b>🌙</b>Détente</button>
</nav>
<div id="sheet"><div id="sh"></div></div>
<div id="night"><span></span></div>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const load=(k,d)=>{try{return JSON.parse(localStorage.getItem('ab_'+k))??d}catch(e){return d}};
let S={kids:load('kids',[{id:1,name:'Bébé',birth:new Date(Date.now()-120*864e5).toISOString().slice(0,10),emoji:'👶'}]),
 kid:load('kid',1),logs:load('logs',[]),foods:load('foods',{}),fdays:load('fdays',{}),mood:load('mood',{}),
 checks:load('checks',{}),milk:load('milk',[]),growth:load('growth',[]),who:load('who','Maman'),dark:load('dark',true),tab:{par:'maman'}};
const save=()=>['kids','kid','logs','foods','fdays','mood','checks','milk','growth','who','dark'].forEach(k=>localStorage.setItem('ab_'+k,JSON.stringify(S[k])));
let page='home';
const kidObj=()=>S.kids.find(k=>k.id==S.kid)||S.kids[0];
const months=b=>Math.max(0,Math.floor((Date.now()-new Date(b))/(30.44*864e5)));
const hm=t=>new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
const ago=t=>{const m=Math.round((Date.now()-t)/6e4);return m<1?"à l'instant":m<60?`il y a ${m} min`:m<1440?`il y a ${Math.round(m/60)} h`:`il y a ${Math.round(m/1440)} j`};
const mmss=s=>{s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function addLog(type,detail,extra={}){S.logs.unshift({t:Date.now(),type,detail,by:S.who,kid:kidObj().id,...extra});S.logs=S.logs.slice(0,500);save();feed();if(page=='home')render()}
const ICON={biberon:'🍼',sein:'🤱',couche:'🧷',sommeil:'😴',note:'📝',vaccin:'💉',medicament:'💊',croissance:'📏'};
function feed(){const l=S.logs[0];$('#feed').textContent=l?`${l.by} : ${ICON[l.type]||''} ${l.detail} ${ago(l.t)}`:'Aucune action pour le moment';$('#feed').style.display=page=='snd'?'none':''}
function sheet(html){$('#sh').innerHTML=html;$('#sheet').classList.add('open')}
function closeSheet(){$('#sheet').classList.remove('open');clearInterval(tmr);tmr=null}
$('#sheet').onclick=e=>{if(e.target.id=='sheet')closeSheet()};
let tmr=null;
function head(){ $('#kid').innerHTML=S.kids.map(k=>`<option value="${k.id}" ${k.id==S.kid?'selected':''}>${k.emoji} ${esc(k.name)} · ${months(k.birth)} mois</option>`).join('');
 $('#theme').textContent=S.dark?'🌙':'☀️';document.documentElement.dataset.t=S.dark?'dark':'light';}
$('#kid').onchange=e=>{S.kid=+e.target.value;save();render()};
$('#theme').onclick=()=>{S.dark=!S.dark;save();head()};
$('#addk').onclick=()=>sheet(`<h1>Nouveau profil</h1><p><input id="n" placeholder="Prénom"></p><p><label>Date de naissance<input id="b" type="date"></label></p><p><input id="e" placeholder="Emoji (👶)" maxlength="2"></p><button class="btn pri" style="width:100%" onclick="newKid()">Ajouter</button>`);
function newKid(){const n=$('#n').value.trim();if(!n||!$('#b').value)return;const id=Date.now();S.kids.push({id,name:n,birth:$('#b').value,emoji:$('#e').value||'👶'});S.kid=id;save();closeSheet();head();render()}
$('#nav').onclick=e=>{const b=e.target.closest('button');if(!b)return;page=b.dataset.p;render()};
$('#fab').onclick=()=>sheet(`<h1>Ajouter</h1><div class="row"><button class="btn" onclick="quick('note')">📝 Note</button><button class="btn" onclick="quick('vaccin')">💉 Vaccin</button><button class="btn" onclick="quick('medicament')">💊 Médicament</button></div>`);
function quick(t){const ph={note:'Votre note',vaccin:'Nom du vaccin',medicament:'Médicament et dose'}[t];
 sheet(`<h1>${ICON[t]} ${ph}</h1><p><input id="q" placeholder="${ph}" autofocus></p><button class="btn pri" style="width:100%" onclick="saveQuick('${t}')">Enregistrer</button>`)}
function saveQuick(t){const v=$('#q').value.trim();if(!v)return;addLog(t,v);closeSheet()}

/* ---------- ACCUEIL ---------- */
function today(){const d=new Date().toDateString();return S.logs.filter(l=>l.kid==kidObj().id&&new Date(l.t).toDateString()==d)}
function pHome(){const L=today();const c=t=>L.filter(l=>t.includes(l.type)).length;
 const ml=L.filter(l=>l.type=='biberon').reduce((a,l)=>a+(l.ml||0),0);
 const sl=L.filter(l=>l.type=='sommeil').reduce((a,l)=>a+(l.sec||0),0);
 const g=S.growth.filter(x=>x.kid==kidObj().id).slice(-1)[0];
 return `<h1>${kidObj().emoji} ${esc(kidObj().name)}, aujourd'hui</h1>
 <div class="card">${c(['biberon','sein'])} repas${ml?` (${ml} ml)`:''} · ${c(['couche'])} couches · ${Math.round(sl/60)} min de sieste</div>
 <div class="grid">
 <button class="card big sal" onclick="mealSheet()"><span class="i">🍼</span>Tétée / Biberon<small>${lastOf(['biberon','sein'])}</small></button>
 <button class="card big sal" onclick="diaperSheet()"><span class="i">🧷</span>Couches<small>${lastOf(['couche'])}</small></button>
 <button class="card big ard" onclick="sleepSheet()"><span class="i">😴</span>Sommeil<small>${lastOf(['sommeil'])}</small></button>
 <button class="card big sag" onclick="growthSheet()"><span class="i">📏</span>Croissance<small>${g?`${g.kg} kg · ${g.cm} cm`:'Aucune mesure'}</small></button>
 </div>
 <h2>Journal</h2>${L.length?L.slice(0,12).map(l=>`<div class="log"><span>${ICON[l.type]} ${esc(l.detail)}</span><span>${hm(l.t)} · ${esc(l.by)}</span></div>`).join(''):'<p class="card">Rien d\'enregistré aujourd\'hui. Touchez une carte pour commencer.</p>'}`}
function lastOf(t){const l=S.logs.find(l=>l.kid==kidObj().id&&t.includes(l.type));return l?ago(l.t):'—'}

function mealSheet(){sheet(`<h1>Repas</h1><div class="tabs"><button class="on" id="t1" onclick="biberon()">Biberon</button><button id="t2" onclick="sein()">Sein</button></div><div id="mb"></div>`);biberon()}
let ml='';
function biberon(){ml='';$('#t1').classList.add('on');$('#t2').classList.remove('on');
 $('#mb').innerHTML=`<div class="timer" id="mlv">0 ml</div><div class="keys">${[1,2,3,4,5,6,7,8,9].map(n=>`<button onclick="key(${n})">${n}</button>`).join('')}<button onclick="ml='';key('')">⌫</button><button onclick="key(0)">0</button><button class="pri" onclick="saveMl()">OK</button></div>`}
function key(n){ml=n===''?ml.slice(0,-1):(ml+n).slice(0,3);$('#mlv').textContent=(ml||0)+' ml'}
function saveMl(){if(!+ml)return;addLog('biberon',ml+' ml',{ml:+ml});closeSheet()}
let sd={G:0,D:0,run:null,t0:0};
function sein(){$('#t2').classList.add('on');$('#t1').classList.remove('on');sd={G:0,D:0,run:null,t0:0};
 $('#mb').innerHTML=`<div class="row"><button class="btn sal" id="bG" onclick="side('G')"><div class="timer" id="tG">00:00</div>Gauche</button><button class="btn sal" id="bD" onclick="side('D')"><div class="timer" id="tD">00:00</div>Droit</button></div><p><button class="btn pri" style="width:100%" onclick="saveSein()">Terminer la tétée</button></p>`}
function side(s){const n=Date.now();if(sd.run)sd[sd.run]+=(n-sd.t0)/1e3;sd.run=sd.run==s?null:s;sd.t0=n;clearInterval(tmr);
 tmr=setInterval(()=>{['G','D'].forEach(k=>{const v=sd[k]+(sd.run==k?(Date.now()-sd.t0)/1e3:0);const e=$('#t'+k);if(e)e.textContent=mmss(v);$('#b'+k)?.classList.toggle('pri',sd.run==k)})},250)}
function saveSein(){if(sd.run){sd[sd.run]+=(Date.now()-sd.t0)/1e3;sd.run=null}const g=Math.round(sd.G/60),d=Math.round(sd.D/60);if(!g&&!d&&sd.G+sd.D<10)return closeSheet();addLog('sein',`Tétée G ${g} min · D ${d} min`);closeSheet()}

function diaperSheet(){let k='',tx='';window.dk=v=>{k=v;document.querySelectorAll('.dk').forEach(b=>b.classList.toggle('pri',b.dataset.v==v))};window.dt=v=>{tx=v;document.querySelectorAll('.dt').forEach(b=>b.classList.toggle('on',b.dataset.v==v))};
 window.saveD=()=>{if(!k)return;addLog('couche',k+(tx?' · '+tx:''));closeSheet()};
 sheet(`<h1>Couche</h1><div class="row">${['Mouillée','Sale','Mixte'].map(v=>`<button class="btn dk" data-v="${v}" onclick="dk('${v}')">${v}</button>`).join('')}</div><h2>Texture / couleur (facultatif)</h2><div class="row">${['Jaune','Verte','Marron','Liquide','Pâteuse','Dure'].map(v=>`<button class="dt" data-v="${v}" onclick="dt('${v}')">${v}</button>`).join('')}</div><p><button class="btn pri" style="width:100%" onclick="saveD()">Enregistrer</button></p>`)}

let slp=load('slp',null);
function sleepSheet(){const draw=()=>{const run=slp&&slp.kid==kidObj().id;sheet(`<h1>Sommeil</h1><div class="timer" id="st">${run?mmss((Date.now()-slp.t)/1e3):'00:00'}</div><button class="btn ${run?'':'pri'}" style="width:100%" onclick="toggleSleep()">${run?'Réveil · arrêter':'Début de sieste'}</button>`);clearInterval(tmr);if(run)tmr=setInterval(()=>{const e=$('#st');if(e)e.textContent=mmss((Date.now()-slp.t)/1e3)},500)};window.toggleSleep=()=>{if(slp){const s=Math.round((Date.now()-slp.t)/1e3);addLog('sommeil',`Sieste ${Math.round(s/60)} min`,{sec:s});slp=null;localStorage.removeItem('ab_slp');closeSheet()}else{slp={t:Date.now(),kid:kidObj().id};localStorage.setItem('ab_slp',JSON.stringify(slp));draw()}};draw()}

function growthSheet(){const id=kidObj().id,G=S.growth.filter(x=>x.kid==id);
 const pts=G.map((g,i)=>`${10+i*(280/Math.max(1,G.length-1))},${90-(g.kg-Math.min(...G.map(x=>x.kg)))/(Math.max(1,Math.max(...G.map(x=>x.kg))-Math.min(...G.map(x=>x.kg))))*70}`).join(' ');
 sheet(`<h1>📏 Croissance</h1>${G.length>1?`<div class="card"><svg viewBox="0 0 300 100" width="100%"><polyline fill="none" stroke="var(--sag)" stroke-width="4" stroke-linecap="round" points="${pts}"/></svg><small>Courbe du poids</small></div>`:''}
 <div class="row"><input id="kg" type="number" step="0.01" inputmode="decimal" placeholder="Poids (kg)"><input id="cm" type="number" step="0.5" inputmode="decimal" placeholder="Taille (cm)"></div><p><button class="btn pri" style="width:100%" onclick="saveG()">Enregistrer la mesure</button></p>
 ${G.slice().reverse().map(g=>`<div class="log"><span>${new Date(g.t).toLocaleDateString('fr-FR')}</span><span>${g.kg} kg · ${g.cm} cm</span></div>`).join('')}`)}
function saveG(){const kg=+$('#kg').value,cm=+$('#cm').value;if(!kg&&!cm)return;S.growth.push({kid:kidObj().id,t:Date.now(),kg,cm});addLog('croissance',`${kg} kg · ${cm} cm`);closeSheet()}

/* ---------- DIVERSIFICATION ---------- */
const FOODS=[['Carotte','🥕',4],['Courgette','🥒',4],['Pomme','🍎',4],['Poire','🍐',4],['Patate douce','🍠',4],['Haricots verts','🫛',4],['Banane','🍌',5],['Potiron','🎃',5],['Brocoli','🥦',5],['Pomme de terre','🥔',5],['Petits pois','🟢',5],['Épinards','🥬',6],['Avocat','🥑',6],['Pêche','🍑',6],['Yaourt nature','🥛',6],['Œuf (cuit dur)','🥚',6,1],['Arachide (poudre)','🥜',6,1],['Poisson blanc','🐟',6,1],['Blé / gluten','🌾',6,1],['Poulet','🍗',6],['Lentilles','🫘',7],['Fraise','🍓',8,1],['Pâtes','🍝',8]];
const REC=[['Purée carotte douce',4,'Carottes vapeur mixées avec un peu d’eau de cuisson, texture lisse.'],['Compote pomme-poire',4,'Fruits cuits à la vapeur, sans sucre ajouté.'],['Velouté courgette',5,'Courgette + pomme de terre, un filet d’huile de colza.'],['Purée patate douce',5,'Patate douce vapeur écrasée, texture épaisse.'],['Bâtonnets DME avocat',6,'Avocat mûr en bâtonnets roulés dans de la poudre de flocons.'],['Brocoli en petits arbres',6,'Vapeur très tendre, à saisir à pleine main (DME).']];
const ST={ok:['Validé','ok'],re:['À réessayer','re'],al:['Allergène','al']};
let q='';
function pFood(){const m=months(kidObj().birth),k=kidObj().id;
 const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-((d.getDay()+6)%7)+i);return d});
 const f=FOODS.filter(x=>x[0].toLowerCase().includes(q.toLowerCase()));
 return `<h1>🥕 Voyage culinaire</h1><p><input id="fs" placeholder="Rechercher un aliment" value="${esc(q)}" oninput="q=this.value;fl()" aria-label="Rechercher un aliment"></p><div id="fres">${foodList(f,m,k)}</div>
 <h2>Cette semaine</h2><div class="cal">${days.map(d=>{const key=k+d.toISOString().slice(0,10);return `<div><b>${'LMMJVSD'[(d.getDay()+6)%7]}</b><br>${(S.fdays[key]||[]).map(n=>FOODS.find(x=>x[0]==n)?.[1]||'•').join('')}</div>`}).join('')}</div>
 <h2>Idées de recettes</h2><div class="car">${REC.filter(r=>r[1]<=Math.max(m,4)+1).map(r=>`<div class="card sag"><b>${r[0]}</b><br><small>Dès ${r[1]} mois</small><p>${r[2]}</p></div>`).join('')}</div>`}
function fl(){const m=months(kidObj().birth);$('#fres').innerHTML=foodList(FOODS.filter(x=>x[0].toLowerCase().includes(q.toLowerCase())),m,kidObj().id)}
function foodList(f,m,k){return f.map(x=>{const s=S.foods[k+x[0]],ok=m>=x[2];return `<div class="card"><div class="log" style="border:0;padding:0"><b>${x[1]} ${x[0]}</b><span class="chip ${ok?'ok':'re'}">${ok?'Dès '+x[2]+' mois ✓':'Dès '+x[2]+' mois'}</span></div>${x[3]?'<small>Allergène courant · introduire seul, en petite quantité</small>':''}
 <div class="row" style="margin-top:8px">${Object.entries(ST).map(([c,[t,cl]])=>`<button class="chip ${s==c?cl:''}" onclick="tag('${x[0]}','${c}')">${t}</button>`).join('')}</div></div>`}).join('')||'<p class="card">Aucun aliment trouvé.</p>'}
function tag(n,c){const k=kidObj().id;S.foods[k+n]=S.foods[k+n]==c?undefined:c;const key=k+new Date().toISOString().slice(0,10);S.fdays[key]=[...new Set([...(S.fdays[key]||[]),n])];save();render()}

/* ---------- PARENTS ---------- */
const MOODS=['😊','🙂','😐','😟','😠'],MN=['Épanouie','Bien','Fatiguée','Anxieuse','Irritée'];
const CK={maman:['Rendez-vous post-natal (6–8 semaines)','Rééducation du périnée','Boire 1,5 L d’eau','Un repas complet assis','10 min pour moi'],papa:['Prendre un tour de nuit','Préparer les biberons','Un moment peau à peau','Sortir marcher 15 min','Parler de la fatigue à son entourage']};
function pPar(){const t=S.tab.par,d=new Date().toISOString().slice(0,10),mo=S.mood[t+d];
 return `<h1>💛 Espace parents</h1><div class="tabs"><button class="${t=='maman'?'on':''}" onclick="S.tab.par='maman';render()">Pour Maman</button><button class="${t=='papa'?'on':''}" onclick="S.tab.par='papa';render()">Pour Papa</button></div>
 <p><select onchange="S.who=this.value;save();feed()" aria-label="Qui utilise l'app">${['Maman','Papa','Nounou'].map(w=>`<option ${S.who==w?'selected':''}>${w}</option>`).join('')}</select></p>
 <h2>Humeur du jour</h2><div class="moods">${MOODS.map((e,i)=>`<button class="${mo==i?'on':''}" aria-label="${MN[i]}" onclick="mood(${i})">${e}</button>`).join('')}</div>${mo>=3?'<p class="card jau">Une journée difficile arrive. Si cela dure plus de 2 semaines, parlez-en à votre médecin ou sage-femme : le baby-blues est fréquent et se soigne.</p>':''}
 <h2>${t=='maman'?'Mon post-partum':'Ma journée'}</h2><div class="card">${CK[t].map((c,i)=>`<label class="ck"><input type="checkbox" ${S.checks[t+i]?'checked':''} onchange="S.checks['${t}${i}']=this.checked;save()">${c}</label>`).join('')}</div>
 ${t=='maman'?milkBlock():''}
 <h2>Espace mental</h2><button class="card big ard" style="width:100%;min-height:90px" onclick="breathe()"><span class="i">🫁</span>Cohérence cardiaque · 5 min</button>
 <h2>Partager une tâche</h2><div class="row">${['Prendre le relais pour la sieste','Acheter du liniment','Préparer le dîner','Lancer une machine'].map(x=>`<button onclick="share('${x}')">${x}</button>`).join('')}</div>`}
function mood(i){S.mood[S.tab.par+new Date().toISOString().slice(0,10)]=i;save();render()}
function milkBlock(){const tot=S.milk.reduce((a,m)=>a+m.ml,0);return `<h2>Mon allaitement</h2><div class="card sal"><b>${tot} ml en stock</b> (${S.milk.length} poches)<div class="row" style="margin-top:8px"><button onclick="addMilk('Frigo')">+ Frigo</button><button onclick="addMilk('Congélo')">+ Congélo</button><button onclick="useMilk()">− Utiliser la plus ancienne</button></div>${S.milk.slice(-4).map(m=>`<div class="log"><span>${m.where} · ${m.ml} ml</span><span>${new Date(m.t).toLocaleDateString('fr-FR')}</span></div>`).join('')}</div>`}
function addMilk(w){sheet(`<h1>Tirage · ${w}</h1><p><input id="mm" type="number" inputmode="numeric" placeholder="Quantité (ml)" autofocus></p><button class="btn pri" style="width:100%" onclick="saveMilk('${w}')">Ajouter au stock</button>`)}
function saveMilk(w){const v=+$('#mm').value;if(!v)return;S.milk.push({where:w,ml:v,t:Date.now()});save();closeSheet();render()}
function useMilk(){S.milk.shift();save();render()}
function share(x){addLog('note','Tâche proposée : '+x);sheet(`<h1>Tâche partagée</h1><p>« ${x} » est visible dans le fil d'actualité. Ouvrez l'app sur l'autre téléphone ou envoyez-la par message.</p><button class="btn pri" style="width:100%" onclick="navigator.share?navigator.share({text:'${x.replace(/'/g,"’")} 💛'}).catch(()=>{}):0;closeSheet()">Envoyer au co-parent</button>`)}
function breathe(){let on=true,left=300;sheet(`<h1>Respirez</h1><div class="breath" id="br">Inspirez</div><div class="timer" id="bt">05:00</div><button class="btn" style="width:100%" onclick="closeSheet()">Arrêter</button>`);
 const step=()=>{const b=$('#br');if(!b)return;b.style.transform=on?'scale(1.5)':'scale(1)';b.textContent=on?'Inspirez':'Expirez';on=!on};step();
 tmr=setInterval(()=>{left--;$('#bt').textContent=mmss(left);if(left%5==0)step();if(left<=0)closeSheet()},1000)}

/* ---------- DÉTENTE ---------- */
const SND=[['white','Bruit blanc','☁️','Bruits blancs'],['brown','Souffle grave','🌫️','Bruits blancs'],['rain','Pluie douce','🌧️','Pluie & Nature'],['forest','Vent & feuilles','🍃','Pluie & Nature'],['heart','Battements de cœur','💗','Battements in-utero'],['womb','Ventre maternel','🫧','Battements in-utero'],['lull','Boîte à musique','🎶','Berceuses'],['lull2','Berceuse lente','🌙','Berceuses']];
let A={ctx:null,m:null,cur:null,src:[],iv:null,end:0,start:0,vol:.7,dur:30};
function audio(){if(!A.ctx){A.ctx=new (window.AudioContext||window.webkitAudioContext)();A.m=A.ctx.createGain();A.m.connect(A.ctx.destination)}A.ctx.resume();return A.ctx}
function noise(type){const c=audio(),n=c.sampleRate*4,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;d[i]=type=='white'?w*.5:(l=(l+.02*w)/1.02)*(type=='brown'?3.5:2.5)}
 const s=c.createBufferSource();s.buffer=b;s.loop=true;return s}
function chain(s,nodes){const c=A.ctx;let p=s;nodes.forEach(([t,f,q])=>{const n=c.createBiquadFilter();n.type=t;n.frequency.value=f;if(q)n.Q.value=q;p.connect(n);p=n});p.connect(A.m);A.src.push(s);s.start()}
function stopSnd(){A.src.forEach(s=>{try{s.stop()}catch(e){}});A.src=[];clearInterval(A.iv);A.cur=null}
function thump(t,f,g){const c=A.ctx,o=c.createOscillator(),e=c.createGain();o.frequency.value=f;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.02);e.gain.exponentialRampToValueAtTime(.001,t+.25);o.connect(e);e.connect(A.m);o.start(t);o.stop(t+.3)}
function note(t,f,len,g){const c=A.ctx,o=c.createOscillator(),e=c.createGain();o.type='sine';o.frequency.value=f;e.gain.setValueAtTime(0,t);e.gain.linearRampToValueAtTime(g,t+.01);e.gain.exponentialRampToValueAtTime(.001,t+len);o.connect(e);e.connect(A.m);o.start(t);o.stop(t+len+.05)}
function playSnd(id){const c=audio();stopSnd();A.cur=id;A.m.gain.cancelScheduledValues(c.currentTime);A.m.gain.value=A.vol;A.start=Date.now();A.end=A.dur?A.start+A.dur*6e4:0;
 if(id=='white')chain(noise('white'),[]);else if(id=='brown')chain(noise('brown'),[['lowpass',500]]);
 else if(id=='rain')chain(noise('pink'),[['highpass',500],['lowpass',6000]]);else if(id=='forest')chain(noise('pink'),[['bandpass',900,.6]]);
 else if(id=='heart'||id=='womb'){const f=id=='heart'?60:45,lo=id=='womb';if(lo)chain(noise('brown'),[['lowpass',300]]);const beat=()=>{const t=c.currentTime+.05;thump(t,f,.9);thump(t+.28,f*.9,.6)};beat();A.iv=setInterval(beat,750)}
 else{const sc=id=='lull'?[392,494,587,494,392,330,392,494,440,392,330,294]:[294,349,440,349,294,262,294,349,330,294,262,220],sp=id=='lull'?.45:.8;let i=0;const n=()=>note(c.currentTime+.05,sc[i++%sc.length],sp*3,.35);n();A.iv=setInterval(n,sp*1000)}
 tick();pSndUpd()}
let ticker=null;
function tick(){clearInterval(ticker);ticker=setInterval(()=>{if(!A.cur)return clearInterval(ticker);const n=Date.now();if(A.end){const left=(A.end-n)/1e3;if(left<=30&&left>0)A.m.gain.value=A.vol*left/30;if(left<=0){stopSnd();clearInterval(ticker);pSndUpd();return}}
 const b=$('#sb'),tl=$('#tl');if(b&&A.end)b.style.width=Math.min(100,(n-A.start)/(A.end-A.start)*100)+'%';if(tl)tl.textContent=A.end?`Reste ${mmss((A.end-n)/1e3)}`:'Sans minuteur'},500)}
function pSndUpd(){if(page=='snd')render()}
function pSnd(){const cats=[...new Set(SND.map(s=>s[3]))],cur=SND.find(s=>s[0]==A.cur);
 return `<h1>🌙 Détente & sommeil</h1><div class="card" style="background:#10172A"><b>${cur?cur[2]+' '+cur[1]:'Choisissez un son'}</b><div class="bar" style="margin:12px 0"><i id="sb"></i></div><div class="row" style="align-items:center;justify-content:center"><button aria-label="Lecture ou pause" class="play" onclick="${cur?'stopSnd();render()':"playSnd('white')"}">${cur?'⏸':'▶'}</button></div><p id="tl" style="text-align:center;color:var(--mut)">${A.end&&cur?'':'Sans minuteur'}</p>
 <label>Volume<input type="range" min="5" max="100" value="${A.vol*100}" oninput="A.vol=this.value/100;if(A.m)A.m.gain.value=A.vol"></label>
 <h2>Minuteur (fondu final de 30 s)</h2><div class="row">${[15,30,60,0].map(m=>`<button class="${A.dur==m?'jau':''}" onclick="A.dur=${m};if(A.cur)playSnd(A.cur);else render()">${m?m+' min':'∞'}</button>`).join('')}</div></div>
 ${cats.map(c=>`<h2>${c}</h2><div class="grid">${SND.filter(s=>s[3]==c).map(s=>`<button class="snd card ${A.cur==s[0]?'jau':''}" onclick="playSnd('${s[0]}')"><span class="i" style="font-size:1.8rem">${s[2]}</span><br>${s[1]}</button>`).join('')}</div>`).join('')}
 <p><button class="btn" style="width:100%;margin-top:14px" onclick="night(true)">🕯️ Veilleuse (écran presque noir)</button></p><p style="color:var(--mut);font-size:.85rem">Les sons sont générés dans l'appareil : ils fonctionnent hors-ligne et en mode avion.</p>`}
function night(on){$('#night').classList.toggle('on',on)}$('#night').onclick=()=>night(false);

function render(){head();feed();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.p==page));$('#fab').style.display=page=='snd'?'none':'';
 $('#main').innerHTML={home:pHome,food:pFood,par:pPar,snd:pSnd}[page]();document.body.classList.toggle('dark-sleep',page=='snd');if(A.cur)tick()}
render();setInterval(feed,60000);
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
